<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000">
<style>
.box{fill:#f5f5f5;stroke:#222;stroke-width:2}.t{font:700 18px Arial}.f{font:14px Arial}
.h{font:700 30px Arial}.s{font:700 20px Arial}.l{stroke:#333;stroke-width:2;fill:none}
</style>
<text x="750" y="40" text-anchor="middle" class="h">Cyber Lakshya — PostgreSQL V1 Data Architecture</text>
<text x="40" y="80" class="s">Infrastructure Inventory</text>
<rect x="40" y="100" width="220" height="130" class="box"/><text x="55" y="128" class="t">locations</text><text x="55" y="153" class="f">PK location_id</text><text x="55" y="175" class="f">location_name / city</text><text x="55" y="197" class="f">data_center / rack</text>
<rect x="330" y="100" width="250" height="150" class="box"/><text x="345" y="128" class="t">assets</text><text x="345" y="153" class="f">PK asset_id</text><text x="345" y="175" class="f">asset_tag / type</text><text x="345" y="197" class="f">manufacturer / model</text><text x="345" y="219" class="f">FK location_id / status</text>
<rect x="650" y="100" width="250" height="150" class="box"/><text x="665" y="128" class="t">servers</text><text x="665" y="153" class="f">PK server_id</text><text x="665" y="175" class="f">FK asset_id</text><text x="665" y="197" class="f">hostname / IP / OS</text><text x="665" y="219" class="f">CPU / RAM / storage</text>
<rect x="970" y="100" width="280" height="150" class="box"/><text x="985" y="128" class="t">network_devices</text><text x="985" y="153" class="f">PK device_id</text><text x="985" y="175" class="f">FK asset_id</text><text x="985" y="197" class="f">type / IP / firmware</text><text x="985" y="219" class="f">management_port</text>
<rect x="1300" y="100" width="160" height="130" class="box"/><text x="1315" y="128" class="t">warranties</text><text x="1315" y="153" class="f">PK warranty_id</text><text x="1315" y="175" class="f">FK asset_id</text><text x="1315" y="197" class="f">start / end</text>
<rect x="330" y="290" width="250" height="140" class="box"/><text x="345" y="318" class="t">maintenance_records</text><text x="345" y="343" class="f">PK maintenance_id</text><text x="345" y="365" class="f">FK asset_id</text><text x="345" y="387" class="f">schedule / status</text><text x="345" y="409" class="f">remarks</text>
<text x="40" y="500" class="s">Software &amp; License Management</text>
<rect x="40" y="525" width="210" height="120" class="box"/><text x="55" y="553" class="t">vendors</text><text x="55" y="578" class="f">PK vendor_id</text><text x="55" y="600" class="f">vendor_name</text><text x="55" y="622" class="f">contact_email</text>
<rect x="310" y="515" width="230" height="140" class="box"/><text x="325" y="543" class="t">software</text><text x="325" y="568" class="f">PK software_id</text><text x="325" y="590" class="f">FK vendor_id</text><text x="325" y="612" class="f">name / version / category</text>
<rect x="600" y="505" width="270" height="160" class="box"/><text x="615" y="533" class="t">licenses</text><text x="615" y="558" class="f">PK license_id</text><text x="615" y="580" class="f">FK software_id</text><text x="615" y="602" class="f">type / quantity</text><text x="615" y="624" class="f">purchase / expiry / status</text>
<rect x="930" y="505" width="300" height="160" class="box"/><text x="945" y="533" class="t">license_assignments</text><text x="945" y="558" class="f">PK assignment_id</text><text x="945" y="580" class="f">FK license_id</text><text x="945" y="602" class="f">FK asset_id</text><text x="945" y="624" class="f">assigned / release / status</text>
<text x="40" y="730" class="s">Monitoring &amp; Security</text>
<rect x="40" y="755" width="300" height="150" class="box"/><text x="55" y="783" class="t">monitoring_metrics</text><text x="55" y="808" class="f">BIGSERIAL metric_id</text><text x="55" y="830" class="f">FK asset_id / recorded_at</text><text x="55" y="852" class="f">CPU / memory / disk</text><text x="55" y="874" class="f">network / temperature</text>
<rect x="400" y="755" width="250" height="140" class="box"/><text x="415" y="783" class="t">alerts</text><text x="415" y="808" class="f">BIGSERIAL alert_id</text><text x="415" y="830" class="f">FK asset_id</text><text x="415" y="852" class="f">type / severity / message</text><text x="415" y="874" class="f">detected_at / status</text>
<rect x="710" y="745" width="300" height="160" class="box"/><text x="725" y="773" class="t">audit_logs</text><text x="725" y="798" class="f">BIGSERIAL audit_id</text><text x="725" y="820" class="f">user / action / resource</text><text x="725" y="842" class="f">old/new JSONB</text><text x="725" y="864" class="f">IP / created_at</text>
<rect x="1070" y="745" width="360" height="160" class="box"/><text x="1085" y="773" class="t">Views → Backend / Dashboard</text><text x="1085" y="800" class="f">asset_overview</text><text x="1085" y="822" class="f">license_overview</text><text x="1085" y="844" class="f">server_health</text><text x="1085" y="866" class="f">dashboard_summary</text>
<!-- relationship lines -->
<path d="M260 165 L330 165" class="l"/><path d="M580 175 L650 175" class="l"/><path d="M580 190 L970 190" class="l"/><path d="M580 150 L1300 150" class="l"/><path d="M455 250 L455 290" class="l"/>
<path d="M250 585 L310 585" class="l"/><path d="M540 585 L600 585" class="l"/><path d="M870 585 L930 585" class="l"/>
<path d="M1080 665 L1080 700 L455 700 L455 755" class="l"/>
<path d="M1080 665 L1080 700 L190 700 L190 755" class="l"/>
<path d="M580 210 L580 700 L190 700" class="l"/>
</svg>